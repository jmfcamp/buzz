# Hula Buzz — Mac desktop release + Tauri auto-updater
#
# Mac-only (darwin-aarch64). Does NOT use Block signing keys, Block updater
# endpoints, or `just release-desktop`. Apple signing uses Tauri's built-in
# codesign/notarize/staple with JM's own Developer ID (secrets below).
#
# Triggers:
#   - workflow_dispatch with version (preferred)
#   - push of tag hula-desktop-vX.Y.Z
#
# Secrets (jmfcamp/buzz):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if key has no password)
#
# Apple signing (all optional; with none set the bundle is ad-hoc signed so
# Info.plist is bound and notifications still register):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
# Notarization (pick one; App Store Connect API key recommended):
#   APPLE_API_KEY                API key id (10 chars)
#   APPLE_API_ISSUER             issuer id (UUID)
#   APPLE_API_PRIVATE_KEY        contents of AuthKey_<id>.p8 (written to a temp file at build time)
#   -- or --
#   APPLE_ID / APPLE_PASSWORD (app-specific password) / APPLE_TEAM_ID
#
# Pubkey + updater endpoint are committed in desktop/src-tauri/tauri.conf.json.
# Rolling updater URL:
#   https://github.com/jmfcamp/buzz/releases/download/hula-desktop-latest/latest.json

name: Hula Desktop Release

concurrency:
  group: hula-desktop-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop semver to publish (X.Y.Z or X.Y.Z-prerelease)
        required: true
        type: string
      promote_updater:
        description: Also update hula-desktop-latest/latest.json
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'hula-desktop-v[0-9]*'

env:
  # Hula ships the protected/OpenClaw UI. Without this, Vite resolves
  # @protected-features to the OSS stubs and release looks nothing like
  # `just desktop-standalone` (which loads desktop/.env.local).
  VITE_BUZZ_BESTIE: "1"
  HULA_UPDATER_ENDPOINT: https://github.com/jmfcamp/buzz/releases/download/hula-desktop-latest/latest.json
  HULA_REPO: jmfcamp/buzz

jobs:
  setup:
    name: Setup
    if: github.repository == 'jmfcamp/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      promote_updater: ${{ steps.version.outputs.promote_updater }}
    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            PROMOTE="${{ inputs.promote_updater }}"
          else
            VERSION="${GITHUB_REF_NAME#hula-desktop-v}"
            PROMOTE=true
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 0.5.23-hula.2 or 0.5.23-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "promote_updater=$PROMOTE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record source SHA
        id: source
        run: echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Refuse Block updater endpoint / missing Hula pubkey
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("desktop/src-tauri/tauri.conf.json"))
          updater = cfg.get("plugins", {}).get("updater", {})
          endpoints = updater.get("endpoints") or []
          pubkey = updater.get("pubkey") or ""
          bad = [e for e in endpoints if "block/buzz" in e or "buzz-desktop-latest" in e]
          if bad:
              print("::error::tauri.conf.json still points at Block updater:", bad)
              sys.exit(1)
          expected = "https://github.com/jmfcamp/buzz/releases/download/hula-desktop-latest/latest.json"
          if expected not in endpoints:
              print("::error::missing Hula updater endpoint in tauri.conf.json")
              sys.exit(1)
          if len(pubkey) < 40:
              print("::error::Hula updater pubkey missing from tauri.conf.json")
              sys.exit(1)
          print("Hula updater config OK")
          PY

  release-macos-arm64:
    name: Release macOS (Apple Silicon)
    if: github.repository == 'jmfcamp/buzz'
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: |
          set -euo pipefail
          # build.rs only enables cfg(buzz_updater_enabled) when BOTH are set at
          # cargo build time. Export for this step AND subsequent job steps via
          # GITHUB_ENV so the Tauri build actually compiles in the updater plugin.
          BUZZ_UPDATER_PUBLIC_KEY=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')
          BUZZ_UPDATER_ENDPOINT="$HULA_UPDATER_ENDPOINT"
          if [[ -z "${BUZZ_UPDATER_PUBLIC_KEY}" || -z "${BUZZ_UPDATER_ENDPOINT}" ]]; then
            echo "::error::BUZZ_UPDATER_PUBLIC_KEY and BUZZ_UPDATER_ENDPOINT must both be set (required at compile time for buzz_updater_enabled)"
            exit 1
          fi
          {
            echo "BUZZ_UPDATER_PUBLIC_KEY=${BUZZ_UPDATER_PUBLIC_KEY}"
            echo "BUZZ_UPDATER_ENDPOINT=${BUZZ_UPDATER_ENDPOINT}"
          } >> "$GITHUB_ENV"
          export BUZZ_UPDATER_PUBLIC_KEY BUZZ_UPDATER_ENDPOINT
          # build-release-config.mjs writes relative to cwd (desktop/)
          (
            cd desktop
            node scripts/build-release-config.mjs
            # Guard: release config must never mention block/buzz
            if grep -E 'block/buzz|buzz-desktop-latest' src-tauri/tauri.release.conf.json; then
              echo "::error::release config leaked a Block updater reference"
              exit 1
            fi
            # Confirm updater artifacts are enabled in the merged release delta
            python3 -c 'import json,sys; cfg=json.load(open("src-tauri/tauri.release.conf.json")); ok=cfg.get("bundle",{}).get("createUpdaterArtifacts") is True; print("createUpdaterArtifacts=true OK") if ok else (print("::error::createUpdaterArtifacts missing/false in tauri.release.conf.json"), sys.exit(1))'
          )

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Guard updater compile-time env
        # build.rs sets cfg(buzz_updater_enabled) only when both are present.
        # Without this, release DMGs ship without tauri_plugin_updater.
        run: |
          set -euo pipefail
          if [[ -z "${BUZZ_UPDATER_PUBLIC_KEY:-}" || -z "${BUZZ_UPDATER_ENDPOINT:-}" ]]; then
            echo "::error::BUZZ_UPDATER_PUBLIC_KEY and BUZZ_UPDATER_ENDPOINT must both be set at cargo build time for the updater plugin"
            exit 1
          fi
          echo "Updater compile-time env OK (endpoint=${BUZZ_UPDATER_ENDPOINT})"


      - name: Guard Hula protected UI env
        # OpenClaw workspace Settings / badges / relay grant UI live behind
        # VITE_BUZZ_BESTIE=1. Missing it ships an OSS frontend (hula.7 lesson).
        run: |
          set -euo pipefail
          if [[ "${VITE_BUZZ_BESTIE:-}" != "1" ]]; then
            echo "::error::VITE_BUZZ_BESTIE must be 1 for Hula desktop releases (got '${VITE_BUZZ_BESTIE:-}')"
            exit 1
          fi
          echo "Hula protected UI env OK (VITE_BUZZ_BESTIE=1)"

      - name: Resolve macOS signing mode
        id: signing
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_CERT" == "true" ]]; then
            [[ "$HAS_IDENTITY" == "true" ]] || { echo "::error::APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY is missing"; exit 1; }
            MODE=developer-id
            if [[ "$HAS_API_KEY" == "true" ]]; then NOTARY=api-key
            elif [[ "$HAS_APPLE_ID" == "true" ]]; then NOTARY=apple-id
            else NOTARY=none; echo "::warning::Developer ID signing without notarization secrets; Gatekeeper will still warn"; fi
          else
            MODE=adhoc; NOTARY=none
            echo "::warning::No APPLE_CERTIFICATE secret; ad-hoc signing the full bundle (notifications work, Gatekeeper warns on first launch)"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "notary=$NOTARY" >> "$GITHUB_OUTPUT"
          echo "Signing mode=$MODE notarization=$NOTARY"

      - name: Build Tauri app (Apple signed + updater-signed)
        # Tauri signs the app and every externalBin sidecar in Contents/MacOS
        # with the same identity, hardened runtime and Entitlements.plist, then
        # notarizes + staples when APPLE_API_* / APPLE_ID creds are present.
        # Ad-hoc mode uses APPLE_SIGNING_IDENTITY="-".
        # BUZZ_UPDATER_* must be present here: lib.rs registers the updater
        # plugin only under #[cfg(buzz_updater_enabled)] (not in debug /
        # desktop-standalone local builds — intentional).
        run: |
          set -euo pipefail
          if [[ "$SIGN_MODE" == "adhoc" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
          else
            if [[ "$NOTARY" == "api-key" ]]; then
              KEY_DIR="$RUNNER_TEMP/apple-api-key"; mkdir -p "$KEY_DIR"; chmod 700 "$KEY_DIR"
              export APPLE_API_KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"; chmod 600 "$APPLE_API_KEY_PATH"
              unset APPLE_API_PRIVATE_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            elif [[ "$NOTARY" == "apple-id" ]]; then
              unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
            else
              unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          fi
          cd desktop && pnpm tauri build --verbose --features mesh-llm --config src-tauri/tauri.release.conf.json
          rm -rf "$RUNNER_TEMP/apple-api-key"
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          NOTARY: ${{ steps.signing.outputs.notary }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Restate explicitly so this step cannot silently regress.
          # Pubkey comes from Generate release config via GITHUB_ENV;
          # endpoint is the workflow-level HULA_UPDATER_ENDPOINT.
          VITE_BUZZ_BESTIE: "1"
          BUZZ_UPDATER_PUBLIC_KEY: ${{ env.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.HULA_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Verify Apple signature (and ad-hoc safety net)
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          NOTARY: ${{ steps.signing.outputs.notary }}
        run: |
          set -euo pipefail
          MACOS_DIR="desktop/src-tauri/target/release/bundle/macos"
          APP=$(find "$MACOS_DIR" -maxdepth 1 -name '*.app' -type d | head -1)
          [[ -n "$APP" ]] || { echo "::error::No .app found in $MACOS_DIR"; exit 1; }
          if [[ "$SIGN_MODE" == "adhoc" ]] && ! desktop/scripts/verify-macos-signing.sh "$APP" adhoc >/dev/null 2>&1; then
            # Safety net if the bundler skipped a sidecar: re-seal ad-hoc, inside-out.
            echo "::warning::Tauri ad-hoc signature incomplete; re-signing ad-hoc inside-out"
            MAIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
            while IFS= read -r -d '' BIN; do
              [[ "$(basename "$BIN")" == "$MAIN" ]] && continue
              file -b "$BIN" | grep -q 'Mach-O' && codesign --force -s - --options runtime "$BIN"
            done < <(find "$APP/Contents" -type f -perm -u+x -print0)
            codesign --force -s - --options runtime --entitlements desktop/src-tauri/Entitlements.plist "$APP"
            # The bundler's DMG holds the pre-fix app; rebuild a plain DMG from the re-sealed one.
            DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
            if [[ -n "$DMG" ]]; then
              rm -f "$DMG"
              hdiutil create -volname "Hula Buzz" -srcfolder "$APP" -ov -format UDZO "$DMG"
            fi
          fi
          FLAG=""
          [[ "$NOTARY" != "none" ]] && FLAG="--notarized"
          desktop/scripts/verify-macos-signing.sh "$APP" "$SIGN_MODE" $FLAG
          desktop/scripts/verify-macos-entitlements.sh "$APP"

      - name: Notarize and staple DMG
        if: steps.signing.outputs.notary != 'none'
        env:
          NOTARY: ${{ steps.signing.outputs.notary }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          [[ -n "$DMG" ]] || { echo "::error::No DMG to notarize"; exit 1; }
          # The keychain Tauri created is gone after the build; the DMG is
          # notarized as a container (its stapled app is already signed), so
          # no identity is needed here.
          if [[ "$NOTARY" == "api-key" ]]; then
            KEY_DIR="$RUNNER_TEMP/apple-api-key"; mkdir -p "$KEY_DIR"; chmod 700 "$KEY_DIR"
            KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"; chmod 600 "$KEY_PATH"
            OK=0; xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait || OK=1
            rm -rf "$KEY_DIR"
          else
            OK=0; xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait || OK=1
          fi
          # The app inside is already notarized + stapled (the real Gatekeeper
          # gate); a DMG ticket is a bonus for offline first open.
          if [[ $OK -eq 0 ]] && xcrun stapler staple "$DMG"; then
            xcrun stapler validate "$DMG"
          else
            echo "::warning::DMG notarization/staple failed; the app inside is still notarized and stapled"
          fi

      # The updater archive is rebuilt from the final signed/stapled .app so
      # in-app updates carry the Apple signature, then minisign-signed with the
      # Tauri updater key (replacing whatever .sig the bundler wrote).
      - name: Ensure updater archive is signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          MACOS_DIR="$BUNDLE_DIR/macos"

          echo "==> bundle/macos before signing:"
          ls -la "$MACOS_DIR" || true
          echo "==> bundle/dmg before signing:"
          ls -la "$BUNDLE_DIR/dmg" || true

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty; cannot sign updater archive"
            exit 1
          fi

          # productName is "Hula Buzz" → paths contain a space
          APP=$(find "$MACOS_DIR" -maxdepth 1 -name '*.app' -type d | head -1)
          [[ -n "$APP" ]] || { echo "::error::No .app found in $MACOS_DIR"; exit 1; }
          APP_BASENAME=$(basename "$APP")
          ARCHIVE="$MACOS_DIR/${APP_BASENAME}.tar.gz"

          echo "==> Rebuilding updater archive from final $APP_BASENAME"
          rm -f "$ARCHIVE"
          (cd "$MACOS_DIR" && COPYFILE_DISABLE=1 tar -czf "${APP_BASENAME}.tar.gz" "$APP_BASENAME")

          rm -f "${ARCHIVE}.sig"
          # tauri signer needs an absolute path; quote for spaces in productName
          TARBALL_ABS="$(cd "$(dirname "$ARCHIVE")" && pwd)/$(basename "$ARCHIVE")"
          echo "==> Signing updater archive: $TARBALL_ABS"
          (cd desktop && pnpm tauri signer sign "$TARBALL_ABS")
          [[ -f "${ARCHIVE}.sig" ]] || { echo "::error::signer did not produce ${ARCHIVE}.sig"; exit 1; }
          ls -la "$ARCHIVE" "${ARCHIVE}.sig"

          # Verify the updater signature against the committed pubkey, exactly
          # what the in-app updater checks.
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          python3 -c 'import json,base64; print(base64.b64decode(json.load(open("desktop/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"]).decode())' > "$RUNNER_TEMP/updater.pub"
          base64 --decode < "${ARCHIVE}.sig" > "$RUNNER_TEMP/updater.minisig"
          minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$ARCHIVE" -x "$RUNNER_TEMP/updater.minisig"
          # And the archive still holds a valid Apple signature after tar round-trip.
          rm -rf "$RUNNER_TEMP/untar" && mkdir -p "$RUNNER_TEMP/untar"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/untar"
          codesign --verify --deep --strict "$RUNNER_TEMP/untar/$APP_BASENAME"
          echo "Updater signature + Apple signature verified in archive"

      - name: Locate and stage artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          mkdir -p staged

          dump_bundle() {
            echo "==> ls -la $BUNDLE_DIR/macos"
            ls -la "$BUNDLE_DIR/macos" || true
            echo "==> ls -la $BUNDLE_DIR/dmg"
            ls -la "$BUNDLE_DIR/dmg" || true
            echo "==> find updater-ish files under $BUNDLE_DIR"
            find "$BUNDLE_DIR" \( -name '*.tar.gz' -o -name '*.sig' -o -name '*.app' -o -name '*.dmg' \) -print 2>/dev/null || true
          }

          fail() {
            echo "::error::$1"
            dump_bundle
            exit 1
          }

          dump_bundle

          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1 || true)
          [[ -n "$DMG" ]] || fail "No DMG found in $BUNDLE_DIR/dmg"

          # productName is "Hula Buzz" → app bundle has a space
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -type d | head -1 || true)
          [[ -n "$APP" ]] || fail "No .app found in $BUNDLE_DIR/macos"

          # Prefer macos/*.tar.gz; fall back to anywhere under bundle/
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1 || true)
          if [[ -z "$ARCHIVE" ]]; then
            ARCHIVE=$(find "$BUNDLE_DIR" -name '*.tar.gz' ! -name '*.sig' -type f | head -1 || true)
          fi
          [[ -n "$ARCHIVE" ]] || fail "Updater .tar.gz missing under $BUNDLE_DIR"

          SIG="${ARCHIVE}.sig"
          if [[ ! -f "$SIG" ]]; then
            # Some Tauri layouts nest .sig beside a differently named archive
            SIG=$(find "$BUNDLE_DIR" -name '*.tar.gz.sig' -type f | head -1 || true)
          fi
          [[ -n "$SIG" && -f "$SIG" ]] || fail "Updater .sig missing for archive: $ARCHIVE"

          DMG_NAME="HulaBuzz_${VERSION}_aarch64.dmg"
          ARCHIVE_NAME="HulaBuzz_${VERSION}_aarch64.app.tar.gz"
          cp "$DMG" "staged/$DMG_NAME"
          cp "$ARCHIVE" "staged/$ARCHIVE_NAME"
          cp "$SIG" "staged/${ARCHIVE_NAME}.sig"

          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "sig_path=staged/${ARCHIVE_NAME}.sig" >> "$GITHUB_OUTPUT"
          ls -la staged

      - name: Generate Mac-only latest.json
        run: |
          set -euo pipefail
          BASE="https://github.com/${HULA_REPO}/releases/download/hula-desktop-v${VERSION}"
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "darwin-aarch64:${{ steps.artifacts.outputs.sig_path }}:${BASE}/${{ steps.artifacts.outputs.archive_name }}" \
            > staged/latest.json
          # Relabel notes for Hula branding
          jq --arg notes "Hula Buzz v${VERSION}" '.notes = $notes' staged/latest.json > staged/latest.json.tmp
          mv staged/latest.json.tmp staged/latest.json
          cp staged/latest.json staged/updater-manifest.json
          cat staged/latest.json
          if grep -E 'block/buzz|buzz-desktop-latest' staged/latest.json; then
            echo "::error::latest.json leaked a Block reference"
            exit 1
          fi

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARY: ${{ steps.signing.outputs.notary }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$NOTARY" != "none" ]]; then
            SIGN_NOTE="Signed with Developer ID and notarized by Apple."
          elif [[ "$SIGN_MODE" == "developer-id" ]]; then
            SIGN_NOTE="Signed with Developer ID (not notarized). First launch may require right-click → Open."
          else
            SIGN_NOTE="Ad-hoc signed (not notarized). First launch may require right-click → Open under Gatekeeper."
          fi
          TAG="hula-desktop-v${VERSION}"
          NOTES="Hula Buzz desktop ${VERSION} (Mac aarch64).

          One-time install: download the DMG, open it, drag Hula Buzz to Applications.
          Thereafter the in-app updater checks:
          ${HULA_UPDATER_ENDPOINT}

          ${SIGN_NOTE}
          "
          if gh release view "$TAG" --repo "$HULA_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/clobbering assets"
          else
            PRERELEASE_FLAGS=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE_FLAGS=(--prerelease --latest=false)
            fi
            gh release create "$TAG" \
              --repo "$HULA_REPO" \
              --target "${{ needs.setup.outputs.source_sha }}" \
              --title "Hula Buzz Desktop v${VERSION}" \
              --notes "$NOTES" \
              ${PRERELEASE_FLAGS[@]+"${PRERELEASE_FLAGS[@]}"}
          fi
          gh release upload "$TAG" staged/* --repo "$HULA_REPO" --clobber

      - name: Update rolling hula-desktop-latest
        if: needs.setup.outputs.promote_updater == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROLLING=hula-desktop-latest
          if ! gh release view "$ROLLING" --repo "$HULA_REPO" >/dev/null 2>&1; then
            gh release create "$ROLLING" \
              --repo "$HULA_REPO" \
              --target "${{ needs.setup.outputs.source_sha }}" \
              --title "Hula Buzz Desktop (auto-updater rolling)" \
              --notes "Rolling Tauri updater manifest for Hula Buzz. Clients fetch latest.json from this release." \
              --latest=false
          fi
          # Only publish latest.json on the rolling tag (installers stay on versioned release)
          gh release upload "$ROLLING" staged/latest.json --repo "$HULA_REPO" --clobber
          echo "Promoted updater manifest to $ROLLING/latest.json for v${VERSION}"
